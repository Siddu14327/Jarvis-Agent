name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          mkdir -p web-app
          unzip -o "Jarvis agent.zip" -d web-app
          cd web-app
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
            SUB_DIR=$(ls -1)
            mv "$SUB_DIR"/* . || true
            mv "$SUB_DIR"/.* . || true
            rmdir "$SUB_DIR" || true
          fi

      - name: Install Dependencies & Build Web Assets
        run: |
          cd web-app
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build --if-present
          else
            echo "Plain web assets detected."
          fi

      - name: Wrap with Capacitor Android
        run: |
          cd web-app
          WEB_DIR="."
          for dir in dist build out public; do
            if [ -d "$dir" ]; then
              WEB_DIR="$dir"
              break
            fi
          done

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Jarvis" "com.jarvis.agent" --web-dir "$WEB_DIR"
          npx cap add android

      - name: Compile Android APK
        run: |
          cd web-app/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p output
          APK_FILE=$(find web-app/android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was generated."
            exit 1
          fi
          cp "$APK_FILE" output/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          
